<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UA 字符串解析 - 移动端测试工具集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="../index.html" class="text-sm text-slate-500 hover:text-blue-600">← 返回工具集</a>
      <h1 class="font-semibold text-slate-700">UA 字符串解析</h1>
      <span></span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">

    <div class="mb-6">
      <label class="text-sm text-slate-600 mb-2 block">粘贴 User-Agent 字符串</label>
      <textarea id="uaInput" rows="4" placeholder="例：Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X) AppleWebKit/605.1.15 ..."
        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 font-mono text-sm"></textarea>
      <div class="flex gap-2 mt-3">
        <button id="parseBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">解析</button>
        <button id="myUaBtn" class="px-5 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300">用本机 UA</button>
        <button id="clearBtn" class="px-5 py-2 text-slate-500 hover:text-slate-700">清空</button>
      </div>
    </div>

    <div id="result" class="hidden bg-white rounded-lg border border-slate-200 p-6">
      <h2 class="font-semibold text-slate-800 mb-4">解析结果</h2>
      <table class="w-full text-sm">
        <tbody id="resultTable"></tbody>
      </table>
    </div>

    <div class="mt-8 bg-amber-50 border border-amber-200 rounded-lg p-4 text-sm text-amber-800">
      💡 提示：UA 解析基于字符串关键词，准确度依赖 UA 规范。Webview/小程序内的 UA 可能含 App 自定义字段，建议结合实际场景判断。
    </div>

  </main>

  <script>
    function parseUA(ua) {
      const result = {};

      // 操作系统
      if (/iPhone|iPad|iPod/.test(ua)) {
        result['操作系统'] = 'iOS';
        const m = ua.match(/OS (\d+[_\.]\d+[_\.\d]*)/);
        if (m) result['系统版本'] = m[1].replace(/_/g, '.');
        if (/iPhone/.test(ua)) result['设备类型'] = 'iPhone';
        else if (/iPad/.test(ua)) result['设备类型'] = 'iPad';
        else if (/iPod/.test(ua)) result['设备类型'] = 'iPod';
      } else if (/Android/.test(ua)) {
        result['操作系统'] = 'Android';
        const m = ua.match(/Android (\d+[\.\d]*)/);
        if (m) result['系统版本'] = m[1];
        const dev = ua.match(/;\s*([^;)]+)\s+Build\//);
        if (dev) result['设备机型'] = dev[1].trim();
      } else if (/HarmonyOS/i.test(ua)) {
        result['操作系统'] = 'HarmonyOS';
      } else if (/Windows NT/.test(ua)) {
        result['操作系统'] = 'Windows';
        const m = ua.match(/Windows NT ([\d\.]+)/);
        if (m) result['系统版本'] = m[1];
      } else if (/Mac OS X/.test(ua)) {
        result['操作系统'] = 'macOS';
        const m = ua.match(/Mac OS X (\d+[_\.]\d+[_\.\d]*)/);
        if (m) result['系统版本'] = m[1].replace(/_/g, '.');
      } else if (/Linux/.test(ua)) {
        result['操作系统'] = 'Linux';
      }

      // 浏览器
      if (/MicroMessenger/i.test(ua)) {
        result['运行环境'] = '微信内置浏览器';
        const m = ua.match(/MicroMessenger\/([\d\.]+)/);
        if (m) result['微信版本'] = m[1];
      } else if (/miniProgram/i.test(ua)) {
        result['运行环境'] = '微信小程序';
      } else if (/AlipayClient/i.test(ua)) {
        result['运行环境'] = '支付宝';
      } else if (/Edg\//.test(ua)) {
        result['浏览器'] = 'Edge';
        const m = ua.match(/Edg\/([\d\.]+)/);
        if (m) result['浏览器版本'] = m[1];
      } else if (/Chrome\//.test(ua)) {
        result['浏览器'] = 'Chrome';
        const m = ua.match(/Chrome\/([\d\.]+)/);
        if (m) result['浏览器版本'] = m[1];
      } else if (/Firefox\//.test(ua)) {
        result['浏览器'] = 'Firefox';
        const m = ua.match(/Firefox\/([\d\.]+)/);
        if (m) result['浏览器版本'] = m[1];
      } else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) {
        result['浏览器'] = 'Safari';
        const m = ua.match(/Version\/([\d\.]+)/);
        if (m) result['浏览器版本'] = m[1];
      }

      // 内核
      if (/WebKit/.test(ua)) result['内核'] = 'WebKit';
      else if (/Gecko/.test(ua) && /Firefox/.test(ua)) result['内核'] = 'Gecko';

      // 终端形态
      if (/Mobi|Mobile|Android.*Mobile|iPhone/.test(ua)) result['终端形态'] = '移动端';
      else if (/iPad|Tablet/.test(ua)) result['终端形态'] = '平板';
      else result['终端形态'] = '桌面端';

      return result;
    }

    function showResult(ua) {
      if (!ua.trim()) return;
      const data = parseUA(ua);
      const tbody = document.getElementById('resultTable');
      tbody.innerHTML = Object.entries(data).map(([k, v]) => `
        <tr class="border-b border-slate-100">
          <td class="py-2.5 text-slate-500 w-32">${k}</td>
          <td class="py-2.5 text-slate-800 font-medium">${v}</td>
        </tr>
      `).join('') + `
        <tr>
          <td class="py-2.5 text-slate-500 align-top">原始 UA</td>
          <td class="py-2.5 text-slate-700 font-mono text-xs break-all">${ua}</td>
        </tr>
      `;
      document.getElementById('result').classList.remove('hidden');
    }

    document.getElementById('parseBtn').addEventListener('click', () => {
      showResult(document.getElementById('uaInput').value);
    });
    document.getElementById('myUaBtn').addEventListener('click', () => {
      document.getElementById('uaInput').value = navigator.userAgent;
      showResult(navigator.userAgent);
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('uaInput').value = '';
      document.getElementById('result').classList.add('hidden');
    });
  </script>
</body>
</html>
