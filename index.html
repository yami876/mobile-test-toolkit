<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动端测试工具集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- 顶栏 -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">📱 移动端测试工具集</h1>
        <p class="text-sm text-slate-500 mt-1">为移动端测试同学打造的在线小工具 + 第三方工具导航</p>
      </div>
      <a href="https://github.com" target="_blank" class="text-sm text-slate-500 hover:text-blue-600">GitHub →</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">

    <!-- 主区：站内小工具 -->
    <section class="mb-12">
      <div class="flex items-end justify-between mb-1">
        <h2 class="text-xl font-bold text-slate-800">🛠 在线小工具</h2>
        <span class="text-sm text-slate-400">共 <span id="miniCount">0</span> 个</span>
      </div>
      <p class="text-sm text-slate-500 mb-5">不用装、不用配，浏览器打开就能用</p>

      <div id="miniGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="miniEmpty" class="hidden bg-white border border-dashed border-slate-300 rounded-lg p-10 text-center text-slate-400">
        还没有在线小工具，去 <code class="bg-slate-100 px-1.5 py-0.5 rounded">data/tools.js</code> 添加一个吧
      </div>
    </section>

    <!-- 第三方工具导航入口 -->
    <section class="mb-6">
      <a href="tools/directory.html"
         class="block bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl p-6 text-white shadow-sm hover:shadow-md transition">
        <div class="flex items-center justify-between">
          <div>
            <div class="flex items-center gap-3 mb-1">
              <span class="text-2xl">📚</span>
              <h2 class="text-xl font-bold">第三方工具导航</h2>
            </div>
            <p class="text-blue-100 text-sm">
              收录 <span id="extCount" class="font-semibold">0</span> 个常用工具，覆盖
              <span id="extCats">性能监测 / 日志崩溃 / 截图录屏 / 抓包 / UI 调试 / 自动化</span>
            </p>
          </div>
          <span class="text-3xl opacity-80">→</span>
        </div>
      </a>
    </section>

  </main>

  <footer class="max-w-6xl mx-auto px-6 py-8 text-center text-sm text-slate-400">
    想加新工具？编辑 <code class="bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">data/tools.js</code> 即可
  </footer>

  <script src="data/tools.js"></script>
  <script>
    const PLATFORM_COLORS = {
      'Android': 'bg-green-100 text-green-700',
      'iOS':     'bg-slate-100 text-slate-700',
      '通用':    'bg-blue-100 text-blue-700',
    };

    // 渲染站内小工具
    const miniTools = TOOLS.filter(t => t.internal);
    document.getElementById('miniCount').textContent = miniTools.length;

    const miniGrid = document.getElementById('miniGrid');
    const miniEmpty = document.getElementById('miniEmpty');

    if (miniTools.length === 0) {
      miniEmpty.classList.remove('hidden');
    } else {
      miniGrid.innerHTML = miniTools.map(t => {
        const platforms = (t.platforms || []).map(p =>
          `<span class="text-xs px-2 py-0.5 rounded ${PLATFORM_COLORS[p] || 'bg-slate-100 text-slate-600'}">${p}</span>`
        ).join('');
        return `
          <a href="${t.url}"
             class="group block bg-white rounded-xl border border-slate-200 p-6 hover:border-blue-500 hover:shadow-lg transition">
            <div class="flex items-start gap-3 mb-3">
              <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0 group-hover:bg-blue-100">
                ${t.icon || '🧩'}
              </div>
              <div class="flex-1">
                <h3 class="font-semibold text-slate-800 mb-1 group-hover:text-blue-600">${t.name}</h3>
                <div class="flex flex-wrap gap-1">${platforms}</div>
              </div>
              <span class="text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition">→</span>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">${t.desc}</p>
          </a>
        `;
      }).join('');
    }

    // 第三方工具入口的统计
    const extTools = TOOLS.filter(t => !t.internal);
    document.getElementById('extCount').textContent = extTools.length;
  </script>
</body>
</html>
